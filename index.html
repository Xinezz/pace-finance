<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pace - a calm, local-first personal finance and savings tracker." />
    <meta name="theme-color" content="#F8F6F0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pace - your money, your pace</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is the default.
      try {
        var t = localStorage.getItem('pace:theme');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
