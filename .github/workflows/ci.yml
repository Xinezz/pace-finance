name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks the code, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # No Supabase keys are needed: without them the app builds in local-only mode.
      - run: npm run build
