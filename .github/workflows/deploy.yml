name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the built site to Pages; it never writes to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the current deploy instead of interrupting it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The site lives at https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Repository variables (Settings → Secrets and variables → Actions → Variables). Only the Project URL and
          # the PUBLISHABLE key belong here: both are shipped to every visitor anyway. Left unset, the site builds
          # in local-only mode. The build refuses to run with a secret key.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
